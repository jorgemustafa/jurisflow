name: magistrum-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.prod}
      APP_DATABASE_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env.prod}
      APP_DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: production-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env.prod}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      target: production-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env.prod}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}?schema=public
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:?Set DATAJUD_API_KEY in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      WEB_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env.prod}
      ENABLE_SYNC_SCHEDULER: ${ENABLE_SYNC_SCHEDULER:-true}
      SYNC_DAILY_TIME: ${SYNC_DAILY_TIME:-06:00}
      OCI_AUTH_METHOD: instance_principal
      OCI_REGION: ${OCI_REGION:?Set OCI_REGION in .env.prod}
      OCI_OBJECT_NAMESPACE: ${OCI_OBJECT_NAMESPACE:?Set OCI_OBJECT_NAMESPACE in .env.prod}
      OCI_OBJECT_BUCKET: ${OCI_OBJECT_BUCKET:?Set OCI_OBJECT_BUCKET in .env.prod}
      DOCUMENT_MAX_SIZE_BYTES: ${DOCUMENT_MAX_SIZE_BYTES:-26214400}
      ENABLE_DOCUMENT_PURGE: ${ENABLE_DOCUMENT_PURGE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3333/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      target: production-web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
