name: CI/CD

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npm run lint
          - name: Typecheck
            command: npm run typecheck
          - name: Tests
            command: npm test
          - name: Build
            command: npm run build
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jurisflow?schema=public
      JWT_SECRET: ci-only-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  deploy:
    name: Deploy to Oracle VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oracle-vm
    concurrency:
      group: oracle-vm-deploy
      cancel-in-progress: false
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER }}
      ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH }}

    steps:
      - name: Validate deploy configuration
        run: |
          : "${ORACLE_VM_HOST:?Set variable ORACLE_VM_HOST in the oracle-vm environment}"
          : "${ORACLE_VM_USER:?Set variable ORACLE_VM_USER in the oracle-vm environment}"
          : "${ORACLE_VM_SSH_KEY:?Set secret ORACLE_VM_SSH_KEY in the oracle-vm environment}"
          : "${ORACLE_VM_KNOWN_HOSTS:?Set secret ORACLE_VM_KNOWN_HOSTS in the oracle-vm environment}"
          : "${ORACLE_VM_DEPLOY_PATH:?Set variable ORACLE_VM_DEPLOY_PATH in the oracle-vm environment}"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/oracle_vm
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_vm ~/.ssh/known_hosts

      - name: Deploy main
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/oracle_vm \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "bash -s -- '$ORACLE_VM_DEPLOY_PATH' '$GITHUB_SHA'" <<'DEPLOY'
          set -euo pipefail
          cd "$1"
          git fetch origin main
          git checkout main
          git merge --ff-only "$2"
          docker run --rm --mount "type=bind,src=$PWD,dst=/app,readonly" -w /app node:22-alpine \
            node scripts/validate-production-env.mjs .env.prod
          docker compose --env-file .env.prod -f compose.prod.yml config --quiet
          docker compose --env-file .env.prod -f compose.prod.yml up -d --build --remove-orphans
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/api/health
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/
          DEPLOY
