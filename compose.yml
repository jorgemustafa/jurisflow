services:
  api:
    build:
      context: .
      target: development
    container_name: jurisflow-api
    command: npm run dev:api
    environment:
      API_PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jurisflow?schema=public
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: jurisflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jurisflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jurisflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: development
    container_name: jurisflow-web
    command: npm run dev:web
    environment:
      VITE_API_URL: http://localhost:3333
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  node-modules:
  postgres-data:
