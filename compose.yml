name: magistrum

services:
  api:
    build:
      context: .
      target: development
    container_name: magistrum-api
    command: sh -c "npm run prisma:generate && npm run dev:api"
    environment:
      API_PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-magistrum}?schema=public
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret}
      WEB_ORIGIN: http://localhost:5173
      ENABLE_SYNC_SCHEDULER: ${ENABLE_SYNC_SCHEDULER:-true}
      SYNC_DAILY_TIME: ${SYNC_DAILY_TIME:-06:00}
      OCI_AUTH_METHOD: config_file
      OCI_CONFIG_FILE: /root/.oci/config
      OCI_CONFIG_PROFILE: ${OCI_CONFIG_PROFILE:-DEFAULT}
      OCI_REGION: ${OCI_REGION:?Set OCI_REGION in .env}
      OCI_OBJECT_NAMESPACE: ${OCI_OBJECT_NAMESPACE:?Set OCI_OBJECT_NAMESPACE in .env}
      OCI_OBJECT_BUCKET: ${OCI_OBJECT_BUCKET:?Set OCI_OBJECT_BUCKET in .env}
      DOCUMENT_MAX_SIZE_BYTES: ${DOCUMENT_MAX_SIZE_BYTES:-26214400}
      ENABLE_DOCUMENT_PURGE: ${ENABLE_DOCUMENT_PURGE:-true}
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - ./.oci:/root/.oci:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: magistrum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magistrum}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: development
    container_name: magistrum-web
    command: npm run dev:web
    environment:
      VITE_API_URL: http://localhost:3333
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  node-modules:
  postgres-data:
